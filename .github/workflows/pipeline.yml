name: MLOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Project Files
      run: |
        echo "Verifying project repository structure..."
        python -c "import os; assert os.path.exists('app.py'); assert os.path.exists('model.pkl'); print('Core MLOps files verified successfully!')"
